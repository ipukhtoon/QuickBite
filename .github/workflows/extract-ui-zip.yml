name: Extract QuickBite UI Testing Milestone

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Extract original ZIP
        run: |
          if [ -d quickbite_stage5 ]; then
            echo "quickbite_stage5 already exists; nothing to extract."
            exit 0
          fi
          unzip -q QuickBite_UI_Testing_Milestone.zip -d .
          test -d quickbite_stage5
          find quickbite_stage5 -maxdepth 2 -type f | head -40
      - name: Commit extracted project files
        run: |
          if [ -d quickbite_stage5 ] && ! git ls-files --error-unmatch quickbite_stage5 >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add quickbite_stage5
            git commit -m "Extract QuickBite UI testing milestone"
            git push origin HEAD:main
          else
            echo "Extracted files are already tracked."
          fi
