name: Extract QuickBite reference assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["quickbite-source.zip", ".github/workflows/integrate-design-assets.yml"]
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate archive and extract original images
        run: |
          set -euo pipefail
          unzip -t quickbite-source.zip
          rm -rf /tmp/qb-source
          mkdir -p /tmp/qb-source
          unzip -q quickbite-source.zip -d /tmp/qb-source
          test -s /tmp/qb-source/public/images/welcome-burger.png
          mkdir -p quickbite_rebuild/public/images
          cp /tmp/qb-source/public/images/* quickbite_rebuild/public/images/
          echo "=== Extracted reference assets ==="
          find quickbite_rebuild/public/images -maxdepth 1 -type f -printf '%f %s bytes\n'
      - name: Commit exact reference image assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quickbite_rebuild/public/images
          if git diff --cached --quiet; then echo "Assets already current."; else git commit -m "Extract original QuickBite reference images"; git push; fi