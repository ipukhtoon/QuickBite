name: QuickBite build, QA and Pages preview
on:
  push:
    branches: [main]
    paths:
      - "quickbite_rebuild/**"
      - "firestore.rules"
      - ".github/workflows/**"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: quickbite-pages
  cancel-in-progress: true
jobs:
  quality:
    name: Build and automated source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quickbite_rebuild/package.json
      - name: Install dependencies
        working-directory: quickbite_rebuild
        run: npm install
      - name: Syntax and test checks
        working-directory: quickbite_rebuild
        run: npm test
      - name: Production build
        working-directory: quickbite_rebuild
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: quickbite-build
          path: quickbite_rebuild/dist
          if-no-files-found: error
  deploy-preview:
    name: Publish verified build preview
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: quickbite-build
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4